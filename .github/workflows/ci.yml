name: HTML Validation CI WorkFlow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .